[project]
name = "xiaosu-internal-assistant"
version = "0.1.0"
description = "小苏公司内部 AI 助手"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.0,<2.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "chromadb>=1.5,<2.0",
    "langchain-community>=0.3,<1.0",
    "langchain-core>=1.0,<2.0",
    "langchain-openai>=1.0,<2.0",
    "langchain-text-splitters>=1.0,<2.0",
    "langgraph>=1.0,<2.0",
    "docx2txt>=0.8,<1.0",
    "pydantic>=2.10,<3.0",
    "python-dotenv>=1.0,<2.0",
    "pypdf>=5.0,<7.0",
    "python-docx>=1.1,<2.0",
    "python-multipart>=0.0.20,<1.0",
    "socksio>=1.0.0,<2.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
